kind = "web"
previewPath = "/"
title = "Triple Diamond Realty"
version = "1.0.0"
id = "artifacts/triple-diamond"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22800

[services.development]
run = "pnpm --filter @workspace/triple-diamond run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/triple-diamond", "run", "build" ]
publicDir = "artifacts/triple-diamond/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22800"
BASE_PATH = "/"
